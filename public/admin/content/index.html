<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager — Pine River Task Force</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <!--
      Versions are pinned (not a floating range like ^3.x) and the
      integrity hash is computed against that exact pinned file, so the
      browser refuses to run anything the CDN didn't actually serve us.
      Bumping either version requires recomputing its hash to match —
      see openssl dgst -sha384 in the project notes.
    -->
    <script
      src="https://unpkg.com/netlify-identity-widget@2.0.3/build/netlify-identity-widget.js"
      integrity="sha384-MDUpeNysRoXS3J89jBylG2fdrQQ0dwDBTXhXGt3XQCgsFF92tnRKZS5vCKNs3XhD"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        --color-ink: #16262b;
        --color-river: #2e6e7e;
        --color-current: #5fa8b0;
        --color-paper: #eef0e9;
        --color-paper-raised: #f8f9f4;
        --color-fog: #c7d0c9;
        --color-fog-dark: #93a099;
        --font-display: 'Fraunces', ui-serif, Georgia, serif;
        --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }
      /* #gate and .portal-bar below both set their own `display`, which
         otherwise ties in specificity with the browser's default [hidden]
         rule and wins (author rules apply after the UA stylesheet), so
         toggling .hidden in JS would silently do nothing without this. */
      [hidden] {
        display: none !important;
      }
      /* Decap's own account/avatar menu in its app header — its only item
         is "Log Out", which our portal-bar above already provides, so this
         is a redundant second logout control. Targets the aria-label Decap
         itself authors on the button (stable across versions) rather than
         its internal, hashed CSS-in-JS class names. */
      [aria-label='Account options dropdown'] {
        display: none;
      }
      /* Same portal-bar as /admin/ and /admin/subscribers/ — sits in normal
         document flow *before* Decap's own script tag, so Decap's app
         (a plain block-level root, not position:fixed) renders below it
         rather than being covered or fought over z-index. */
      .portal-bar {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 1rem 1.75rem;
        border-bottom: 1px solid var(--color-fog);
        background: var(--color-paper-raised);
        font-family: var(--font-body);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        text-decoration: none;
        color: var(--color-ink);
      }
      .brand .mark {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        border: 1.5px solid var(--color-river);
        color: var(--color-river);
        padding: 0.3rem 0.4rem;
        line-height: 1;
      }
      .brand .brand-text {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.05rem;
        color: var(--color-ink);
      }
      .tools {
        display: flex;
        gap: 0.35rem;
        margin-right: auto;
      }
      .tools a {
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
        color: var(--color-ink);
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
      }
      .tools a:hover {
        background: var(--color-paper);
      }
      .tools a.active {
        background: var(--color-ink);
        color: var(--color-paper);
      }
      .view-site {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--color-river);
        text-decoration: none;
        margin-right: 1.25rem;
      }
      .view-site:hover {
        text-decoration: underline;
      }
      #session {
        font-size: 0.85rem;
        color: var(--color-fog-dark);
      }
      #session button {
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--color-river);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
      }
      /* Covers Decap's own splash screen (its logo/wordmark and "Login with
         Netlify Identity" button) entirely until a session is confirmed,
         rather than trying to reach into Decap's internal, auto-generated
         CSS-in-JS class names — those aren't stable across versions, this
         plain overlay approach is. */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--color-paper);
        font-family: var(--font-body);
        text-align: center;
        padding: 1.5rem;
      }
      #gate .mark {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        border: 1.5px solid var(--color-river);
        color: var(--color-river);
        padding: 0.35rem 0.5rem;
        line-height: 1;
      }
      #gate h1 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.4rem;
        color: var(--color-ink);
        margin: 0;
      }
      #gate p {
        color: #45575c;
        margin: 0;
        max-width: 24rem;
      }
      #gate button {
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.65rem 1.3rem;
        border-radius: 4px;
        border: 1px solid var(--color-ink);
        background: var(--color-ink);
        color: var(--color-paper);
        cursor: pointer;
      }
      #gate button:hover {
        background: var(--color-river);
        border-color: var(--color-river);
      }
    </style>
  </head>
  <body>
    <header class="portal-bar" hidden>
      <a class="brand" href="/admin/">
        <span class="mark">PRC</span>
        <span class="brand-text">Admin Portal</span>
      </a>
      <nav class="tools">
        <a href="/admin/content/" class="active">Content Manager</a>
        <a href="/admin/subscribers/">Mailing List</a>
      </nav>
      <a class="view-site" href="/">View site →</a>
      <div id="session"></div>
    </header>
    <div id="gate">
      <span class="mark">PRC</span>
      <h1>Content Manager</h1>
      <p>Sign in to add news, events, meeting minutes, and page updates.</p>
      <button id="gate-login" type="button">Log in</button>
    </div>
    <script
      src="https://unpkg.com/decap-cms@3.14.1/dist/decap-cms.js"
      integrity="sha384-K+E/B3QG3FJrtRXoyUjME4ilx71pYGyrvAVxYvd/p0zCPuXsc3eoEuSzUW3Ke63V"
      crossorigin="anonymous"
    ></script>
    <script>
      const sessionEl = document.getElementById('session');
      const headerEl = document.querySelector('.portal-bar');
      const gateEl = document.getElementById('gate');

      function renderSession(user) {
        sessionEl.innerHTML = '';
        const label = document.createElement('span');
        label.textContent = (user.user_metadata?.full_name || user.email) + ' — ';
        const logout = document.createElement('button');
        logout.type = 'button';
        logout.textContent = 'Log out';
        logout.addEventListener('click', () => window.netlifyIdentity.logout());
        sessionEl.append(label, logout);
      }

      function showApp() {
        headerEl.hidden = false;
        gateEl.hidden = true;
      }

      function showGate() {
        headerEl.hidden = true;
        gateEl.hidden = false;
      }

      document
        .getElementById('gate-login')
        .addEventListener('click', () => window.netlifyIdentity.open('login'));

      // Netlify Identity redirects here with a token in the URL hash after
      // an invite/confirmation email link; bounce it to the site root where
      // the widget expects to handle it, then back.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (user) {
            renderSession(user);
            showApp();
          } else {
            showGate();
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/content/';
            });
          }
        });
        window.netlifyIdentity.on('login', (user) => {
          renderSession(user);
          showApp();
        });
        window.netlifyIdentity.on('logout', showGate);
      }
    </script>
  </body>
</html>
