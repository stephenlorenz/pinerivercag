<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailing List — Pine River Task Force</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <!-- Same pinned version + integrity hash as /admin/content/, so all
         three admin pages share one vetted copy of the Identity widget. -->
    <script
      src="https://unpkg.com/netlify-identity-widget@2.0.3/build/netlify-identity-widget.js"
      integrity="sha384-MDUpeNysRoXS3J89jBylG2fdrQQ0dwDBTXhXGt3XQCgsFF92tnRKZS5vCKNs3XhD"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        --color-ink: #16262b;
        --color-river: #2e6e7e;
        --color-current: #5fa8b0;
        --color-clay: #a8623b;
        --color-paper: #eef0e9;
        --color-paper-raised: #f8f9f4;
        --color-fog: #c7d0c9;
        --color-fog-dark: #93a099;
        --font-display: 'Fraunces', ui-serif, Georgia, serif;
        --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--color-ink);
        background: var(--color-paper);
      }
      .portal-bar {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 1rem 1.75rem;
        border-bottom: 1px solid var(--color-fog);
        background: var(--color-paper-raised);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        text-decoration: none;
        color: var(--color-ink);
      }
      .brand .mark {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        border: 1.5px solid var(--color-river);
        color: var(--color-river);
        padding: 0.3rem 0.4rem;
        line-height: 1;
      }
      .brand .brand-text {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.05rem;
      }
      .tools {
        display: flex;
        gap: 0.35rem;
        margin-right: auto;
      }
      .tools a {
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
        color: var(--color-ink);
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
      }
      .tools a:hover {
        background: var(--color-paper);
      }
      .tools a.active {
        background: var(--color-ink);
        color: var(--color-paper);
      }
      #session {
        font-size: 0.85rem;
        color: var(--color-fog-dark);
      }
      #session button {
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--color-river);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
      }
      main {
        max-width: 56rem;
        margin: 0 auto;
        padding: 3rem 1.75rem 4rem;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-river);
        margin: 0 0 0.6rem;
      }
      h1 {
        font-family: var(--font-display);
        font-size: 1.9rem;
        margin: 0 0 2rem;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 0;
        color: #45575c;
      }
      .status.error {
        color: var(--color-clay);
      }
      .btn {
        font-family: var(--font-body);
        font-size: 0.88rem;
        font-weight: 600;
        padding: 0.55rem 1.1rem;
        border-radius: 4px;
        border: 1px solid var(--color-ink);
        background: var(--color-ink);
        color: var(--color-paper);
        cursor: pointer;
      }
      .btn:hover {
        background: var(--color-river);
        border-color: var(--color-river);
      }
      .btn.secondary {
        background: transparent;
        color: var(--color-ink);
        border-color: var(--color-fog-dark);
      }
      .btn.secondary:hover {
        background: var(--color-paper-raised);
        border-color: var(--color-ink);
        color: var(--color-ink);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      #count {
        margin-right: auto;
        font-size: 0.88rem;
        color: var(--color-fog-dark);
      }
      .table-wrap {
        background: var(--color-paper-raised);
        border: 1px solid var(--color-fog);
        border-radius: 6px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.7rem 1.1rem;
        font-size: 0.92rem;
      }
      th {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-fog-dark);
        border-bottom: 1px solid var(--color-fog);
        font-weight: 500;
      }
      tbody tr:nth-child(even) {
        background: rgba(199, 208, 201, 0.18);
      }
      tbody tr:not(:last-child) td {
        border-bottom: 1px solid rgba(199, 208, 201, 0.5);
      }
      .empty {
        padding: 2.5rem 1.1rem;
        text-align: center;
        color: var(--color-fog-dark);
      }
    </style>
  </head>
  <body>
    <header class="portal-bar">
      <a class="brand" href="/admin/">
        <span class="mark">PRC</span>
        <span class="brand-text">Admin Portal</span>
      </a>
      <nav class="tools">
        <a href="/admin/content/">Content Manager</a>
        <a href="/admin/subscribers/" class="active">Mailing List</a>
      </nav>
      <div id="session"></div>
    </header>
    <main>
      <p class="eyebrow">Admin Portal</p>
      <h1>Mailing List Signups</h1>

      <div id="status" class="status">Checking sign-in…</div>

      <div id="content" hidden>
        <div class="toolbar">
          <span id="count"></span>
          <button id="refresh" class="btn secondary" type="button">Refresh</button>
          <button id="download" class="btn" type="button">Download CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Submitted</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
    <script>
      const statusEl = document.getElementById('status');
      const contentEl = document.getElementById('content');
      const rowsEl = document.getElementById('rows');
      const countEl = document.getElementById('count');
      const sessionEl = document.getElementById('session');

      function renderSession(user) {
        sessionEl.innerHTML = '';
        if (user) {
          const label = document.createElement('span');
          label.textContent = (user.user_metadata?.full_name || user.email) + ' — ';
          const logout = document.createElement('button');
          logout.type = 'button';
          logout.textContent = 'Log out';
          logout.addEventListener('click', () => window.netlifyIdentity.logout());
          sessionEl.append(label, logout);
        } else {
          const login = document.createElement('button');
          login.type = 'button';
          login.textContent = 'Log in';
          login.addEventListener('click', () => window.netlifyIdentity.open('login'));
          sessionEl.appendChild(login);
        }
      }

      function renderRows(rows) {
        rowsEl.innerHTML = '';
        if (rows.length === 0) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 3;
          td.className = 'empty';
          td.textContent = 'No signups yet.';
          tr.appendChild(td);
          rowsEl.appendChild(tr);
        }
        for (const row of rows) {
          const tr = document.createElement('tr');
          const nameCell = document.createElement('td');
          const emailCell = document.createElement('td');
          const dateCell = document.createElement('td');
          nameCell.textContent = row.name;
          emailCell.textContent = row.email;
          dateCell.textContent = row.submitted_at
            ? new Date(row.submitted_at).toLocaleString()
            : '';
          tr.append(nameCell, emailCell, dateCell);
          rowsEl.appendChild(tr);
        }
        countEl.textContent = rows.length + (rows.length === 1 ? ' signup' : ' signups');
      }

      function showLoginPrompt() {
        statusEl.hidden = false;
        statusEl.classList.remove('error');
        contentEl.hidden = true;
        statusEl.textContent = '';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn';
        button.textContent = 'Log in to view signups';
        button.addEventListener('click', () => window.netlifyIdentity.open('login'));
        statusEl.appendChild(button);
      }

      async function loadSubmissions() {
        statusEl.hidden = false;
        statusEl.classList.remove('error');
        contentEl.hidden = true;
        statusEl.textContent = 'Loading…';
        try {
          const user = window.netlifyIdentity.currentUser();
          const token = await user.jwt();
          const res = await fetch('/.netlify/functions/subscribers', {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) {
            statusEl.classList.add('error');
            statusEl.textContent = `Could not load signups (error ${res.status}). Try refreshing.`;
            return;
          }
          const rows = await res.json();
          statusEl.hidden = true;
          contentEl.hidden = false;
          renderRows(rows);
        } catch {
          statusEl.classList.add('error');
          statusEl.textContent = 'Something went wrong loading signups. Try refreshing.';
        }
      }

      async function downloadCsv() {
        const user = window.netlifyIdentity.currentUser();
        const token = await user.jwt();
        const res = await fetch('/.netlify/functions/subscribers?format=csv', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'mailing-list.csv';
        link.click();
        URL.revokeObjectURL(url);
      }

      document.getElementById('refresh').addEventListener('click', loadSubmissions);
      document.getElementById('download').addEventListener('click', downloadCsv);

      window.netlifyIdentity.on('init', (user) => {
        renderSession(user);
        if (user) {
          loadSubmissions();
        } else {
          showLoginPrompt();
        }
      });
      window.netlifyIdentity.on('login', (user) => {
        window.netlifyIdentity.close();
        renderSession(user);
        loadSubmissions();
      });
      window.netlifyIdentity.on('logout', () => {
        renderSession(null);
        showLoginPrompt();
      });
      window.netlifyIdentity.init();
    </script>
  </body>
</html>
